<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="t d"><title id="t">YUGORA mutual matching flow</title><desc id="d">One user's like stays private if the other person has not liked them. A match is stored and revealed only after two reciprocal likes.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#bb8c67"/></marker></defs><rect width="1280" height="410" rx="24" fill="#f6f2eb"/><text x="48" y="55" fill="#1b3936" font-size="27" font-family="Arial" font-weight="700">THE MUTUAL-ONLY MATCH RULE</text>
<rect x="45" y="125" width="270" height="150" rx="18" fill="#e8dfd4" stroke="#c7b9a7" stroke-width="2"/><text x="180" y="170" text-anchor="middle" fill="#263d39" font-size="20" font-family="Arial" font-weight="700">Person A → LIKE</text><text x="180" y="206" text-anchor="middle" fill="#5a6b63" font-size="15" font-family="Arial">One directed Swipe row</text><text x="180" y="236" text-anchor="middle" fill="#5a6b63" font-size="14" font-family="Arial">A → B · LIKE</text>
<path d="M315 200 H440" stroke="#bb8c67" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="455" y="125" width="300" height="150" rx="18" fill="#fffaf4" stroke="#c7b9a7" stroke-width="2"/><text x="605" y="169" text-anchor="middle" fill="#263d39" font-size="20" font-family="Arial" font-weight="700">Wait for reciprocity</text><text x="605" y="207" text-anchor="middle" fill="#5a6b63" font-size="15" font-family="Arial">If B has not liked A:</text><text x="605" y="238" text-anchor="middle" fill="#a36e4b" font-size="15" font-family="Arial" font-weight="700">No match · no disclosure</text>
<path d="M755 200 H880" stroke="#bb8c67" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="895" y="125" width="335" height="150" rx="18" fill="#1d403c"/><text x="1062" y="169" text-anchor="middle" fill="#fff8ee" font-size="20" font-family="Arial" font-weight="700">Person B → LIKE</text><text x="1062" y="207" text-anchor="middle" fill="#dce8df" font-size="15" font-family="Arial">B → A · LIKE</text><text x="1062" y="238" text-anchor="middle" fill="#f2c99f" font-size="15" font-family="Arial" font-weight="700">Mutual · create Match</text>
<path d="M1062 275 V325 H180 V285" fill="none" stroke="#7f9c8d" stroke-width="2" stroke-dasharray="7 7"/><text x="620" y="358" text-anchor="middle" fill="#68756f" font-size="15" font-family="Arial">Only the mutual Match is returned by GET /matches. One-sided interest remains private.</text></svg>