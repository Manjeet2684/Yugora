<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d"><title id="t">YUGORA system architecture</title><desc id="d">Hexagonal architecture: inbound user interface and HTTP adapters invoke application use cases, which depend on domain policy and outbound repository ports. Prisma adapters implement the ports and persist data in PostgreSQL.</desc>
<defs><linearGradient id="p" x2="1" y2="1"><stop stop-color="#173a38"/><stop offset="1" stop-color="#2e5953"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#d5a984"/></marker></defs>
<rect width="1280" height="560" rx="26" fill="#f6f2eb"/><text x="56" y="58" fill="#1b3936" font-family="Arial" font-size="27" font-weight="700">YUGORA · HEXAGONAL ARCHITECTURE</text><text x="56" y="87" fill="#68756f" font-family="Arial" font-size="16">Dependencies point inward. Persistence and framework details stay outside the core.</text>
<rect x="54" y="145" width="205" height="115" rx="16" fill="#e6dfd3" stroke="#c7b9a7"/><text x="156" y="184" text-anchor="middle" fill="#263d39" font-family="Arial" font-size="18" font-weight="700">Inbound adapters</text><text x="156" y="214" text-anchor="middle" fill="#586963" font-family="Arial" font-size="14">UI / HTTP routes</text><text x="156" y="237" text-anchor="middle" fill="#8a7663" font-family="Arial" font-size="12">Frontend + API gates</text>
<rect x="340" y="145" width="235" height="115" rx="16" fill="#e4eee9" stroke="#8da99b"/><text x="457" y="184" text-anchor="middle" fill="#24443e" font-family="Arial" font-size="18" font-weight="700">Application layer</text><text x="457" y="214" text-anchor="middle" fill="#4a6960" font-family="Arial" font-size="14">GetFeed · RecordSwipe</text><text x="457" y="237" text-anchor="middle" fill="#4a6960" font-family="Arial" font-size="14">GetMatches</text>
<rect x="655" y="145" width="230" height="115" rx="16" fill="#f3e5d5" stroke="#d9b58f"/><text x="770" y="184" text-anchor="middle" fill="#4a382b" font-family="Arial" font-size="18" font-weight="700">Domain core</text><text x="770" y="214" text-anchor="middle" fill="#755d49" font-family="Arial" font-size="14">Profile · Swipe · Match</text><text x="770" y="237" text-anchor="middle" fill="#755d49" font-family="Arial" font-size="14">Mutual-LIKE policy</text>
<rect x="965" y="145" width="260" height="115" rx="16" fill="#d9e9e2" stroke="#7c9d90"/><text x="1095" y="184" text-anchor="middle" fill="#1f433c" font-family="Arial" font-size="18" font-weight="700">Outbound ports</text><text x="1095" y="214" text-anchor="middle" fill="#4a6960" font-family="Arial" font-size="14">Profile / Swipe / Match repos</text><text x="1095" y="237" text-anchor="middle" fill="#4a6960" font-family="Arial" font-size="14">Unit of Work</text>
<path d="M259 203 H330 M575 203 H645 M885 203 H955" fill="none" stroke="#b98762" stroke-width="3" marker-end="url(#arr)"/>
<rect x="415" y="365" width="310" height="112" rx="16" fill="url(#p)"/><text x="570" y="406" text-anchor="middle" fill="#fff8ee" font-family="Arial" font-size="19" font-weight="700">Prisma persistence adapters</text><text x="570" y="436" text-anchor="middle" fill="#d6e3dc" font-family="Arial" font-size="14">Prisma 7 · @prisma/adapter-pg</text><text x="570" y="458" text-anchor="middle" fill="#d6e3dc" font-family="Arial" font-size="13">Transactional repositories</text>
<rect x="830" y="365" width="260" height="112" rx="16" fill="#eee2d3" stroke="#c9ad91"/><text x="960" y="407" text-anchor="middle" fill="#40352b" font-family="Arial" font-size="20" font-weight="700">PostgreSQL</text><text x="960" y="438" text-anchor="middle" fill="#786550" font-family="Arial" font-size="14">Durable source of truth</text><text x="960" y="460" text-anchor="middle" fill="#786550" font-family="Arial" font-size="13">FKs · uniqueness · CHECKs</text>
<path d="M1095 260 V318 H570 V355 M725 421 H820" fill="none" stroke="#b98762" stroke-width="3" marker-end="url(#arr)"/>
<text x="56" y="520" fill="#68756f" font-family="Arial" font-size="14">Gate 1: domain + application contracts · Gate 2: PostgreSQL / Prisma adapters · Gate 3: HTTP routes · Gate 4: UI</text></svg>