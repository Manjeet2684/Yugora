name: YUGORA quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/yugora-ci.db
      DEMO_USER_ID: demo-user
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and generate Prisma Client
        run: npm install --no-audit --no-fund
      - name: Validate schema, type-check, migrate, seed twice and test
        run: npm run check
