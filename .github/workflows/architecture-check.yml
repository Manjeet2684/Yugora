name: YUGORA quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yugora
          POSTGRES_PASSWORD: yugora
          POSTGRES_DB: yugora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yugora -d yugora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://yugora:yugora@localhost:5432/yugora?schema=public
      DIRECT_URL: postgresql://yugora:yugora@localhost:5432/yugora?schema=public
      DEMO_USER_ID: demo-user
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and lock PostgreSQL adapter dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Preserve original project author metadata in lockfile
        run: npm run lock:normalize
      - name: Commit generated lockfile for same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh PostgreSQL dependency lockfile"
          git push origin "HEAD:${BRANCH}"
      - name: Preserve generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: yugora-postgresql-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Install locked dependencies and generate Prisma Client
        run: npm ci --no-fund
      - name: Audit the resolved dependency tree
        run: npm audit --audit-level=high
      - name: Validate schema, type-check, migrate, seed twice and test
        run: npm run check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run production-browser E2E suite
        run: npm run test:e2e
