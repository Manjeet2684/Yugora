name: YUGORA quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/yugora-ci.db
      DEMO_USER_ID: demo-user
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies and generate Prisma Client
        run: npm ci --no-fund
      - name: Audit the resolved dependency tree
        run: npm audit --audit-level=high
      - name: Validate schema, type-check, migrate, seed twice and test
        run: npm run check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run production-browser E2E suite
        run: npm run test:e2e